<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail — PetNutrition AI</title>
    <link rel="stylesheet" href="css/pet-style.css" />
</head>

<body>
    <header class="topbar">
        <a href="pet-index.html" class="brand">
            <div class="brand-icon">🐾</div>
            <div class="brand-text">
                <div class="name">PetNutrition AI</div>
                <div class="sub">Powered by ML</div>
            </div>
        </a>
        <nav class="nav-links">
            <a class="nav-link" href="pet-index.html">Home</a>
            <a class="nav-link" href="recommendations.html">Recommendations</a>
        </nav>
        <a href="recommendations.html" class="btn btn-ghost">← Back to Results</a>
    </header>

    <div style="min-height:calc(100vh - 64px);padding:40px 24px;">
        <div class="container-sm">
            <!-- Back breadcrumb -->
            <div style="margin-bottom:24px;">
                <a href="recommendations.html"
                    style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-3);font-weight:700;transition:var(--t);"
                    onmouseover="this.style.color='var(--accent-light)'" onmouseout="this.style.color='var(--text-3)'">
                    ← Back to Recommendation
                </a>
            </div>

            <!-- Product content (rendered by JS) -->
            <div id="product-content"></div>
        </div>
    </div>

    <script src="js/pet-data.js"></script>
    <script src="js/pet-app.js"></script>
    <script>
        function renderProduct() {
            const productId = localStorage.getItem('viewingProduct');
            const profile = STORAGE.getProfile();
            const content = document.getElementById('product-content');

            if (!productId) {
                content.innerHTML = `<div class="empty"><div class="empty-icon">❓</div><h3>No product selected</h3><p>Please choose a product from your recommendations.</p><a href="recommendations.html" class="btn btn-primary" style="margin-top:16px;">← Back to Recommendations</a></div>`;
                return;
            }

            const p = STORAGE.getProduct(productId);
            if (!p) {
                content.innerHTML = `<div class="empty"><div class="empty-icon">❓</div><h3>Product not found</h3><a href="recommendations.html" class="btn btn-primary" style="margin-top:16px;">← Back</a></div>`;
                return;
            }

            let score = 0;
            let reason = '';
            if (profile) {
                score = scoreProduct(p, profile);
                reason = generateReason(p, profile);
            }

            const tagBadges = (arr, cls) => arr.map(t => `<span class="rec-tag ${cls}" style="padding:5px 14px;font-size:12px;">${t}</span>`).join('');

            content.innerHTML = `
        <!-- Hero -->
        <div class="product-hero fade-in">
          <div class="product-hero-img">${p.emoji}</div>
          <div class="product-hero-info">
            <div class="brand-tag">${p.brand}</div>
            <h1>${p.name}</h1>
            <div class="price">฿${p.price.toLocaleString()} <small>/ ${p.unit}</small></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
              ${p.species === 'dog' ? '<span class="badge badge-orange">🐕 Dog</span>' : '<span class="badge badge-purple">🐱 Cat</span>'}
              ${tagBadges(p.diseaseSupport, 'rec-tag-teal')}
              ${score > 0 ? `<span class="badge badge-teal">Score: ${score}/100</span>` : ''}
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn btn-orange" onclick="markInterested()">
                ❤️ Mark as Interested
              </button>
              <button class="btn btn-ghost" onclick="history.back()">
                ← Back
              </button>
            </div>
          </div>
        </div>

        ${reason ? `
        <!-- Why Recommended -->
        <div class="card fade-in" style="margin-bottom:24px;padding:20px 24px;background:rgba(0,201,167,0.06);border-color:rgba(0,201,167,0.25);">
          <div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--teal);margin-bottom:8px;">Why This is Recommended for ${profile?.name || 'Your Pet'}</div>
          <div style="font-size:15px;color:var(--text-1);line-height:1.7;">💡 ${reason}</div>
        </div>` : ''}

        <!-- Nutritional Info -->
        <div style="margin-bottom:24px;">
          <div class="section-hdr"><div class="section-title">📊 Nutritional Composition</div></div>
          <div class="nutrition-grid">
            <div class="nutrition-card" style="--accent:var(--accent);">
              <div class="nutrition-val" style="color:var(--accent-light);">${p.proteinPct}%</div>
              <div class="nutrition-lbl">Protein</div>
            </div>
            <div class="nutrition-card">
              <div class="nutrition-val" style="color:var(--orange);">${p.fatPct}%</div>
              <div class="nutrition-lbl">Fat</div>
            </div>
            <div class="nutrition-card">
              <div class="nutrition-val" style="color:var(--teal);">${p.fiberPct}%</div>
              <div class="nutrition-lbl">Fiber</div>
            </div>
            <div class="nutrition-card">
              <div class="nutrition-val" style="color:var(--text-2);">${p.moisture}%</div>
              <div class="nutrition-lbl">Moisture</div>
            </div>
            <div class="nutrition-card">
              <div class="nutrition-val" style="color:var(--yellow);">${p.calories}</div>
              <div class="nutrition-lbl">kcal/kg</div>
            </div>
          </div>
        </div>

        <!-- Details Grid -->
        <div class="card fade-in" style="margin-bottom:24px;padding:28px;">
          <div style="font-size:14px;font-weight:800;margin-bottom:20px;color:var(--text-1);">🔎 Product Details</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <div>
              <div style="font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Protein Source</div>
              <div style="font-size:15px;font-weight:700;">${p.protein}</div>
            </div>
            <div>
              <div style="font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Age Group</div>
              <div style="font-size:15px;font-weight:700;">${p.ageGroup}</div>
            </div>
            <div>
              <div style="font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Suitable For</div>
              <div style="font-size:14px;color:var(--text-2);">${p.suitableFor}</div>
            </div>
            <div>
              <div style="font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Disease Support</div>
              <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;">
                ${p.diseaseSupport.length > 0
                    ? tagBadges(p.diseaseSupport, 'rec-tag-teal')
                    : '<span style="font-size:14px;color:var(--text-2);">General / Maintenance</span>'}
              </div>
            </div>
            <div style="grid-column:span 2;">
              <div style="font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Key Highlight</div>
              <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(253,150,68,0.1);border:1px solid rgba(253,150,68,0.25);padding:8px 16px;border-radius:var(--radius-full);">
                <span style="font-size:16px;">⭐</span>
                <span style="font-size:14px;font-weight:700;color:var(--orange);">${p.highlight}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Description -->
        <div class="card fade-in" style="margin-bottom:28px;padding:28px;">
          <div style="font-size:14px;font-weight:800;margin-bottom:12px;color:var(--text-1);">📄 About This Product</div>
          <div style="font-size:15px;color:var(--text-2);line-height:1.8;">${p.description}</div>
        </div>

        <!-- Tags -->
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px;">
          ${tagBadges(p.tags, 'rec-tag-purple')}
        </div>

        <!-- Bottom CTA -->
        <div style="display:flex;gap:12px;justify-content:center;padding:20px 0;border-top:1px solid var(--border);">
          <a href="recommendations.html" class="btn btn-outline btn-lg">← Back to Recommendation</a>
          <button class="btn btn-orange btn-lg" onclick="markInterested()">❤️ Mark as Interested</button>
        </div>
      `;
        }

        function markInterested() {
            const productId = localStorage.getItem('viewingProduct');
            const p = STORAGE.getProduct(productId);
            if (!p) return;
            STORAGE.addClick(p.id, p.name);
            showToast('Saved! ❤️', `${p.name} added to your interests. Recommendations adapting...`, 'love');
            setTimeout(() => { window.location.href = 'recommendations.html'; }, 1200);
        }

        document.addEventListener('DOMContentLoaded', renderProduct);
    </script>
</body>

</html>
